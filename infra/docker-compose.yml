services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - app_data:/data
    restart: unless-stopped

  trainer:
    build:
      context: ..
      dockerfile: infra/Dockerfile.trainer.cuda
    volumes:
      - app_data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - trainer

volumes:
  app_data:
