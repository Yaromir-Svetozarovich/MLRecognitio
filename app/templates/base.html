<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blank Aligner{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Blank Aligner</div>
        <div class="nav-links">
            <a href="/">Главная</a>
            <a href="/templates">Шаблоны</a>
            <a href="/align">Нормализация</a>
            <a href="/health">Статус</a>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <p>Blank Aligner v5.0 — ЛР1–ЛР5</p>
    </footer>
    <script src="/static/js/app.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
